<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kids' English Menu</title>
<!-- Google Fonts for playful font -->
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap" rel="stylesheet" />
<style>
  body {
    background: linear-gradient(to right, #ffe259, #ffa751);
    font-family: 'Comic Neue', cursive, sans-serif;
    margin: 0;
    padding: 20px;
    text-align: center;
  }

  h1 {
    font-size: 3em;
    color: #fff;
    text-shadow: 2px 2px 4px #000;
    margin-bottom: 30px;
  }

  /* Style for the menu container */
  .menu {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }

  /* Style for each button/link */
  .menu a {
    background-color: #fff;
    color: #ff6f61;
    padding: 20px 40px;
    font-size: 1.5em;
    border-radius: 15px;
    text-decoration: none;
    box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
    transition: transform 0.2s, background-color 0.2s;
  }

  /* Hover effects for fun interaction */
  .menu a:hover {
    background-color: #ffecd2;
    transform: scale(1.05);
  }

  /* Responsive adjustments for small screens */
  @media(max-width: 600px) {
    h1 {
      font-size: 2em;
    }
    .menu a {
      font-size: 1.2em;
      padding: 15px 30px;
    }
  }
</style>
</head>
<body>

<h1>🌟 Welcome to Kids' English! 🌟</h1>
<div class="menu">
  <a href="kids_english_learning.html">1- Learning Fun</a>
  <a href="kids_english_v2.html">2- Another Learning Fun</a>
</div>

</body>
</html>
